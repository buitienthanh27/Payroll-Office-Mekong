<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Danh sách nhân viên - Tiền lương Khối Văn phòng</title>
<!-- Tailwind / FontAwesome: bỏ qua nếu file menu đã nạp sẵn -->
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<script src="payroll-vp-config.js"></script>
<script>
  tailwind.config = { theme: { extend: { colors: { brand: { light:'#34d399', DEFAULT:'#10b981', dark:'#059669' } } } } };
</script>
</head>
<!-- Khi include vào menu: chỉ lấy phần <section id="payroll-employee-list"> và <script> cuối -->
<body class="bg-slate-50 font-sans text-slate-800">

<section id="payroll-employee-list" class="p-6 max-w-screen-2xl mx-auto space-y-6">

  <!-- Tiêu đề + hành động -->
  <div class="flex flex-wrap items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold text-slate-800">Danh sách nhân viên</h1>
      <p class="text-sm text-slate-500 mt-1">Khối văn phòng Campuchia · Lương định suất USD · Passport/CMND là dữ liệu payroll đầu vào</p>
    </div>
    <div class="flex items-center gap-3">
      <button class="text-sm bg-brand hover:bg-brand-dark text-white font-semibold px-4 py-2 rounded-lg transition-colors flex items-center gap-2">
        <i class="fa-solid fa-file-excel"></i> Xuất Excel
      </button>
    </div>
  </div>

  <!-- Thẻ thống kê nhanh -->
  <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 border-l-4 border-l-brand">
      <p class="text-sm text-slate-500 font-medium">Tổng nhân viên</p>
      <h3 class="text-2xl font-extrabold text-slate-800 mt-1" id="stat-total">0</h3>
    </div>
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
      <p class="text-sm text-slate-500 font-medium">Đang làm việc</p>
      <h3 class="text-2xl font-extrabold text-emerald-600 mt-1" id="stat-active">0</h3>
    </div>
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
      <p class="text-sm text-slate-500 font-medium">Thử việc</p>
      <h3 class="text-2xl font-extrabold text-amber-500 mt-1" id="stat-probation">0</h3>
    </div>
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
      <p class="text-sm text-slate-500 font-medium">Số phòng ban</p>
      <h3 class="text-2xl font-extrabold text-slate-800 mt-1" id="stat-dept">0</h3>
    </div>
  </div>

  <!-- Bộ lọc + bảng -->
  <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
    <div class="p-4 border-b border-slate-100 flex flex-wrap items-center gap-3">
      <div class="relative flex-1 min-w-[220px]">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
        <input id="f-search" type="text" placeholder="Tìm theo mã NV hoặc họ tên..."
          class="w-full pl-9 pr-4 py-2 bg-slate-100 border-none rounded-lg text-sm focus:ring-2 focus:ring-brand outline-none" />
      </div>
      <select id="f-dept" aria-label="Lọc theo phòng ban" title="Lọc theo phòng ban" class="text-sm border border-slate-200 rounded-lg px-3 py-2 bg-white focus:ring-2 focus:ring-brand outline-none">
        <option value="">Tất cả phòng ban</option>
      </select>
      <select id="f-rank" aria-label="Lọc theo nhóm" title="Lọc theo nhóm" class="text-sm border border-slate-200 rounded-lg px-3 py-2 bg-white focus:ring-2 focus:ring-brand outline-none">
        <option value="">Tất cả nhóm</option>
        <option value="Quản lý">Quản lý</option>
        <option value="Chuyên viên">Chuyên viên</option>
        <option value="Nhân viên">Nhân viên</option>
      </select>
      <select id="f-status" aria-label="Lọc theo trạng thái" title="Lọc theo trạng thái" class="text-sm border border-slate-200 rounded-lg px-3 py-2 bg-white focus:ring-2 focus:ring-brand outline-none">
        <option value="">Tất cả trạng thái</option>
        <option value="active">Đang làm việc</option>
        <option value="probation">Thử việc</option>
        <option value="left">Nghỉ việc</option>
      </select>
      <button id="f-reset" class="text-sm text-slate-500 hover:text-brand px-3 py-2 flex items-center gap-1.5">
        <i class="fa-solid fa-arrow-rotate-left"></i> Đặt lại
      </button>
    </div>

    <div class="overflow-x-auto">
      <table class="w-full text-sm text-left">
        <thead class="bg-slate-50 text-slate-600 font-medium">
          <tr>
            <th class="px-4 py-3 w-10"><input type="checkbox" class="rounded border-slate-300" title="Chọn tất cả" /></th>
            <th class="px-4 py-3">Mã NV</th>
            <th class="px-4 py-3">Nhân viên</th>
            <th class="px-4 py-3">Phòng ban</th>
            <th class="px-4 py-3">Chức danh</th>
            <th class="px-4 py-3">Passport / CMND</th>
            <th class="px-4 py-3 text-center">Hệ số AD</th>
            <th class="px-4 py-3 text-right">Lương định suất (USD)</th>
            <th class="px-4 py-3 text-center">Trạng thái</th>
            <th class="px-4 py-3 text-center">Thao tác</th>
          </tr>
        </thead>
        <tbody id="emp-body" class="divide-y divide-slate-100"></tbody>
      </table>
    </div>

    <!-- Phân trang -->
    <div class="p-4 border-t border-slate-100 flex flex-wrap items-center justify-between gap-3">
      <p class="text-sm text-slate-500" id="page-info">—</p>
      <div class="flex items-center gap-1" id="pager"></div>
    </div>
  </div>
</section>

<script>
(function(){
  const CFG = window.MKC_PAYROLL_VP_CONFIG;
  const EMP = CFG.payrollRows.map((r, i)=>[
    r.code,
    r.name,
    r.department,
    i < 2 ? 'Quản lý' : 'Chuyên viên',
    i < 2 ? 'Quản lý' : 'Chuyên viên',
    r.passport,
    i < 2 ? 1.00 : 0.80,
    r.baseSalary,
    'active'
  ]);

  const STATUS = {
    active:    ["Đang làm việc","bg-emerald-100 text-emerald-700"],
    probation: ["Thử việc","bg-amber-100 text-amber-700"],
    left:      ["Nghỉ việc","bg-slate-200 text-slate-600"],
  };
  const AVA = ["bg-emerald-100 text-emerald-600","bg-teal-100 text-teal-600","bg-green-100 text-green-600","bg-lime-100 text-lime-600","bg-cyan-100 text-cyan-600"];
  const fmt = (n)=> Number(n||0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const initials = (name)=>{ const p=name.trim().split(' '); return (p[p.length-2]?.[0]||'')+(p[p.length-1]?.[0]||''); };

  const $ = (id)=> document.getElementById(id);
  const body=$('emp-body'), pager=$('pager'), pageInfo=$('page-info');
  const fSearch=$('f-search'), fDept=$('f-dept'), fRank=$('f-rank'), fStatus=$('f-status');
  const PAGE_SIZE = 8; let page = 1;

  // nạp danh mục phòng ban
  [...new Set(EMP.map(e=>e[2]))].forEach(d=>{ const o=document.createElement('option'); o.value=d; o.textContent=d; fDept.appendChild(o); });

  // thống kê
  $('stat-total').textContent = CFG.totals.employeeCount;
  $('stat-active').textContent = CFG.totals.employeeCount;
  $('stat-probation').textContent = EMP.filter(e=>e[8]==='probation').length;
  $('stat-dept').textContent = CFG.departments.length;

  function filtered(){
    const q=fSearch.value.trim().toLowerCase(), d=fDept.value, r=fRank.value, s=fStatus.value;
    return EMP.filter(e=>
      (!q || e[0].toLowerCase().includes(q) || e[1].toLowerCase().includes(q)) &&
      (!d || e[2]===d) && (!r || e[4]===r) && (!s || e[8]===s));
  }

  function render(){
    const rows = filtered();
    const pages = Math.max(1, Math.ceil(rows.length/PAGE_SIZE));
    if(page>pages) page=pages;
    const slice = rows.slice((page-1)*PAGE_SIZE, page*PAGE_SIZE);

    body.innerHTML = slice.length ? slice.map((e,i)=>{
      const [st,cls]=STATUS[e[8]]; const av=AVA[(e[0].charCodeAt(2)+i)%AVA.length];
      return `<tr class="hover:bg-slate-50 transition">
        <td class="px-4 py-3"><input type="checkbox" class="rounded border-slate-300" /></td>
        <td class="px-4 py-3 font-mono text-xs font-semibold text-brand">${e[0]}</td>
        <td class="px-4 py-3">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-full ${av} flex items-center justify-center text-xs font-bold shrink-0">${initials(e[1])}</div>
            <div><p class="font-semibold text-slate-800">${e[1]}</p>
            <p class="text-xs text-slate-400">${e[0].toLowerCase()}@caosu.vn</p></div>
          </div>
        </td>
        <td class="px-4 py-3 text-slate-600">${e[2]}</td>
        <td class="px-4 py-3 text-slate-600">${e[3]}</td>
        <td class="px-4 py-3"><span class="font-mono text-slate-700">${e[5]}</span></td>
        <td class="px-4 py-3 text-center font-medium">${e[6].toFixed(2)}</td>
        <td class="px-4 py-3 text-right font-semibold text-slate-800">${fmt(e[7])}</td>
        <td class="px-4 py-3 text-center"><span class="${cls} py-1 px-2.5 rounded-full text-xs font-bold whitespace-nowrap">${st}</span></td>
        <td class="px-4 py-3 text-center">
          <button title="Xem hồ sơ" class="text-slate-400 hover:text-brand px-1.5" onclick="viewDetail('${e[0]}')"><i class="fa-solid fa-eye"></i></button>
          <button title="Sửa" class="text-slate-400 hover:text-brand px-1.5"><i class="fa-solid fa-pen"></i></button>
        </td>
      </tr>`;
    }).join('') : `<tr><td colspan="10" class="px-4 py-10 text-center text-slate-400">
      <i class="fa-regular fa-folder-open text-2xl mb-2 block"></i>Không tìm thấy nhân viên phù hợp</td></tr>`;

    const from = rows.length ? (page-1)*PAGE_SIZE+1 : 0;
    const to = Math.min(page*PAGE_SIZE, rows.length);
    pageInfo.textContent = `Hiển thị ${from}–${to} trong tổng ${rows.length} nhân viên`;

    let html = `<button data-p="${page-1}" class="pg px-3 py-1.5 rounded-lg border border-slate-200 text-sm ${page<=1?'opacity-40 pointer-events-none':'hover:bg-slate-50'}"><i class="fa-solid fa-chevron-left"></i></button>`;
    for(let i=1;i<=pages;i++) html += `<button data-p="${i}" class="pg px-3.5 py-1.5 rounded-lg text-sm font-medium ${i===page?'bg-brand text-white':'border border-slate-200 text-slate-600 hover:bg-slate-50'}">${i}</button>`;
    html += `<button data-p="${page+1}" class="pg px-3 py-1.5 rounded-lg border border-slate-200 text-sm ${page>=pages?'opacity-40 pointer-events-none':'hover:bg-slate-50'}"><i class="fa-solid fa-chevron-right"></i></button>`;
    pager.innerHTML = html;
    pager.querySelectorAll('.pg').forEach(b=> b.onclick=()=>{ page=+b.dataset.p; render(); });
  }

  [fSearch,fDept,fRank,fStatus].forEach(el=> el.addEventListener('input', ()=>{ page=1; render(); }));
  $('f-reset').onclick = ()=>{ fSearch.value=''; fDept.value=''; fRank.value=''; fStatus.value=''; page=1; render(); };

  window.viewDetail = function(code) {
    localStorage.setItem('selected_emp_code', code);
    window.location.href = 'ho-so-chi-tiet-nhan-vien.html';
  };

  render();
})();
</script>
</body>
</html>
