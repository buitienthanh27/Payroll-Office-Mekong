<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Duyệt bảng lương - Tiền lương Khối Văn phòng</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<script src="payroll-vp-config.js"></script>
<script src="payroll-store.js"></script>
<script>
  tailwind.config = { theme: { extend: { colors: { brand: { light:'#34d399', DEFAULT:'#10b981', dark:'#059669' } } } } };
</script>
<style>
  .inp{ border:1px solid #e2e8f0; border-radius:.5rem; padding:.5rem .75rem; font-size:.875rem; outline:none; }
  .inp:focus{ box-shadow:0 0 0 2px #6ee7b7; border-color:#10b981; }
  .num{ font-variant-numeric:tabular-nums; }
  .step-done{ background:#10b981; color:#fff; }
  .step-active{ background:#ecfdf5; color:#059669; border:2px solid #10b981; }
  .step-wait{ background:#f1f5f9; color:#94a3b8; }
</style>
</head>
<body class="bg-slate-50 font-sans text-slate-800">

<section id="payroll-approve" class="p-6 max-w-screen-2xl mx-auto space-y-6">

  <div class="flex flex-wrap items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold text-slate-800">Duyệt bảng lương</h1>
      <p class="text-sm text-slate-500 mt-1">Quy trình 4 bước: Kế toán lương -> TP TC-KT -> Giám đốc Tài chính -> Tổng Giám đốc.</p>
    </div>
    <label for="f-ky" class="sr-only">Kỳ lương</label>
    <select id="f-ky" class="inp bg-white text-sm" title="Chọn kỳ lương"><option>Tháng 01/2026</option><option>Tháng 02/2026</option></select>
  </div>

  <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-amber-100 border-l-4 border-l-amber-400">
      <p class="text-sm text-slate-500 font-medium">Chờ duyệt</p><h3 class="text-2xl font-extrabold text-amber-500 mt-1" id="s-pending">0</h3></div>
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
      <p class="text-sm text-slate-500 font-medium">Đã duyệt</p><h3 class="text-2xl font-extrabold text-emerald-600 mt-1" id="s-approved">0</h3></div>
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
      <p class="text-sm text-slate-500 font-medium">Tổng thực chi</p><h3 class="text-xl font-extrabold text-brand mt-1 num" id="s-net">0</h3></div>
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
      <p class="text-sm text-slate-500 font-medium">Số nhân viên</p><h3 class="text-2xl font-extrabold text-slate-800 mt-1" id="s-emp">0</h3></div>
  </div>

  <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
    <div class="p-4 border-b border-slate-100 flex flex-wrap items-center gap-3">
      <select id="f-status" class="inp bg-white text-sm" title="Chọn trạng thái">
        <option value="">Tất cả trạng thái</option>
        <option value="pending">Chờ duyệt</option><option value="approved">Đã duyệt</option><option value="rejected">Từ chối</option>
      </select>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full text-sm text-left">
        <thead class="bg-slate-50 text-slate-600 font-medium">
          <tr>
            <th class="px-4 py-3">Kỳ lương</th>
            <th class="px-4 py-3 text-center">NV</th>
            <th class="px-4 py-3 text-right">Tổng thu nhập</th>
            <th class="px-4 py-3 text-right">Khấu trừ</th>
            <th class="px-4 py-3 text-right">Thực chi</th>
            <th class="px-4 py-3">Quy trình duyệt</th>
            <th class="px-4 py-3 text-center">Trạng thái</th>
            <th class="px-4 py-3 text-center">Thao tác</th>
          </tr>
        </thead>
        <tbody id="tbl-body" class="divide-y divide-slate-100"></tbody>
      </table>
    </div>
  </div>
</section>

<div id="modal" class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50 p-4">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg max-h-[90vh] overflow-y-auto">
    <div class="px-5 py-4 border-b border-slate-100 flex justify-between items-center sticky top-0 bg-white">
      <h3 class="font-bold text-slate-800" id="m-title">Duyệt bảng lương</h3>
      <button id="m-close" type="button" title="Đóng" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
    </div>
    <div class="p-5 space-y-4" id="m-body"></div>
    <div class="px-5 py-4 border-t border-slate-100 flex justify-end gap-3 sticky bottom-0 bg-white" id="m-actions"></div>
  </div>
</div>

<script>
(function(){
  const CFG = window.MKC_PAYROLL_VP_CONFIG;
  const fmt=n=>Number(n||0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })+' USD';
  const STEPS=['Kế toán lương','TP TC-KT','GĐ Tài chính','TGĐ'];
  const periodDeduct = () => Number.isFinite(Number(CFG.totals.deduction))
    ? Number(CFG.totals.deduction)
    : CFG.totals.advance + CFG.totals.otherTax + CFG.totals.pit;

  // [ky, nv, gross, deduct, net, step(0-3), status, rejectNote]
  let DATA=[
    ['01/2026',CFG.totals.employeeCount,CFG.totals.gross,periodDeduct(),CFG.totals.gross-periodDeduct(),1,'pending',''],
    ['12/2025',37,28420.10,3020.60,25399.50,3,'approved',''],
  ];

  function stepHtml(step, status){
    return `<div class="flex items-center gap-1">${STEPS.map((s,i)=>{
      let cls='step-wait w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold shrink-0';
      if(status==='rejected'&&i===step) cls='bg-red-500 text-white w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold';
      else if(i<step||(status==='approved'&&i<=3)) cls='step-done w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold shrink-0';
      else if(i===step&&status==='pending') cls='step-active w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold shrink-0';
      return `<span class="${cls}" title="${s}">${i+1}</span>${i<3?'<span class="w-3 h-0.5 bg-slate-200 shrink-0"></span>':''}`;
    }).join('')}</div><p class="text-xs text-slate-400 mt-1">${status==='approved'?'Hoàn tất':status==='rejected'?'Bị từ chối':'Bước: '+STEPS[step]}</p>`;
  }

  function badge(st){
    if(st==='approved') return '<span class="bg-emerald-100 text-emerald-700 text-xs font-bold px-2.5 py-1 rounded-full">Đã duyệt</span>';
    if(st==='rejected') return '<span class="bg-red-100 text-red-600 text-xs font-bold px-2.5 py-1 rounded-full">Từ chối</span>';
    return '<span class="bg-amber-100 text-amber-700 text-xs font-bold px-2.5 py-1 rounded-full">Chờ duyệt</span>';
  }

  function stats(){
    const pending=DATA.filter(d=>d[6]==='pending').length;
    const cur=DATA.find(d=>d[0]==='01/2026');
    document.getElementById('s-pending').textContent=pending;
    document.getElementById('s-approved').textContent=DATA.filter(d=>d[6]==='approved').length;
    if(cur){ document.getElementById('s-net').textContent=fmt(cur[4]); document.getElementById('s-emp').textContent=cur[1]; }
  }

  function render(){
    const st=document.getElementById('f-status').value;
    const rows=DATA.filter(d=>!st||d[6]===st);
    document.getElementById('tbl-body').innerHTML=rows.map((d,i)=>`
      <tr class="hover:bg-slate-50">
        <td class="px-4 py-3 font-semibold">Tháng ${d[0]}</td>
        <td class="px-4 py-3 text-center">${d[1]}</td>
        <td class="px-4 py-3 text-right num">${fmt(d[2])}</td>
        <td class="px-4 py-3 text-right num text-red-500">${fmt(d[3])}</td>
        <td class="px-4 py-3 text-right num font-bold text-brand">${fmt(d[4])}</td>
        <td class="px-4 py-3">${stepHtml(d[5],d[6])}</td>
        <td class="px-4 py-3 text-center">${badge(d[6])}</td>
        <td class="px-4 py-3 text-center">
          ${d[6]==='pending'?`<button data-idx="${i}" class="btn-approve text-sm bg-brand hover:bg-brand-dark text-white font-semibold px-3 py-1.5 rounded-lg"><i class="fa-solid fa-stamp"></i> Duyệt</button>`:
            `<button data-idx="${i}" class="btn-view text-brand hover:bg-emerald-50 px-2 py-1 rounded-lg"><i class="fa-solid fa-eye"></i></button>`}
        </td></tr>`).join('');

    document.querySelectorAll('.btn-approve,.btn-view').forEach(b=>{
      b.onclick=()=> openModal(+b.dataset.idx, b.classList.contains('btn-view'));
    });
    stats();
  }

  function openModal(idx, viewOnly){
    const d=DATA[idx];
    document.getElementById('m-title').textContent='Bảng lương Tháng '+d[0];
    document.getElementById('m-body').innerHTML=`
      <div class="grid grid-cols-2 gap-3 text-sm">
        <div class="p-3 bg-slate-50 rounded-lg"><p class="text-slate-500">Nhân viên</p><p class="font-bold">${d[1]} người</p></div>
        <div class="p-3 bg-slate-50 rounded-lg"><p class="text-slate-500">Thực chi</p><p class="font-bold text-brand">${fmt(d[4])}</p></div>
        <div class="p-3 bg-slate-50 rounded-lg"><p class="text-slate-500">Tổng thu nhập</p><p class="font-bold">${fmt(d[2])}</p></div>
        <div class="p-3 bg-slate-50 rounded-lg"><p class="text-slate-500">Khấu trừ</p><p class="font-bold text-red-500">${fmt(d[3])}</p></div>
      </div>
      <div class="pt-2">${stepHtml(d[5],d[6])}</div>
      ${d[6]==='pending'?`<label class="text-sm block">Ghi chú / lý do<textarea id="m-note" class="inp w-full mt-1 h-20" placeholder="Ghi chú khi duyệt hoặc từ chối..."></textarea></label>`:''}
      ${d[7]?`<p class="text-sm text-red-600"><i class="fa-solid fa-circle-xmark"></i> ${d[7]}</p>`:''}`;

    document.getElementById('m-actions').innerHTML= viewOnly||d[6]!=='pending'?`<button id="m-ok" class="text-sm border border-slate-200 px-4 py-2 rounded-lg">Đóng</button>`:
      `<button id="m-reject" class="text-sm border border-red-200 text-red-600 px-4 py-2 rounded-lg hover:bg-red-50">Từ chối</button>
       <button id="m-approve" class="text-sm bg-brand hover:bg-brand-dark text-white font-semibold px-4 py-2 rounded-lg"><i class="fa-solid fa-check"></i> Duyệt bước ${STEPS[d[5]]}</button>`;

    const m=document.getElementById('modal'); m.classList.remove('hidden'); m.classList.add('flex');
    const close=()=>{ m.classList.add('hidden'); m.classList.remove('flex'); };
    document.getElementById('m-close').onclick=close;
    const ok=document.getElementById('m-ok'); if(ok) ok.onclick=close;
    const appr=document.getElementById('m-approve');
    if(appr) appr.onclick=()=>{
      const note=document.getElementById('m-note').value.trim();
      if(d[5]>=3){ d[6]='approved'; d[5]=3; }
      else d[5]++;
      close(); render();
      alert('Đã duyệt bước '+STEPS[d[5]-1]+(note?'\nGhi chú: '+note:''));
    };
    const rej=document.getElementById('m-reject');
    if(rej) rej.onclick=()=>{
      d[6]='rejected'; d[7]=document.getElementById('m-note').value.trim()||'Không đạt yêu cầu kiểm tra';
      close(); render();
    };
  }

  document.getElementById('f-status').onchange=render;
  document.getElementById('modal').onclick=e=>{ if(e.target.id==='modal') document.getElementById('m-close').click(); };
  render();
})();
</script>
</body>
</html>
