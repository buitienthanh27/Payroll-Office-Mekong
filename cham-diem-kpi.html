<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Xếp loại A/B/C & chấm điểm KPI - Tiền lương Khối Văn phòng</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<script>
  tailwind.config = { theme: { extend: { colors: { brand: { light:'#34d399', DEFAULT:'#10b981', dark:'#059669' } } } } };
</script>
<style>
  .inp{ border:1px solid #e2e8f0; border-radius:.5rem; padding:.5rem .75rem; font-size:.875rem; outline:none; transition:all 0.2s;}
  .inp:focus{ box-shadow:0 0 0 2px #6ee7b7; border-color:#10b981; }
  .score-inp{ width:56px; text-align:center; padding:4px; border:1px solid #e2e8f0; border-radius:6px; font-weight:600; transition:all 0.2s; }
  .score-inp:focus{ outline:none; border-color:#10b981; box-shadow:0 0 0 2px #6ee7b7; }
  .grade-A{ background:#ecfdf5; color:#059669; border:1px solid #a7f3d0; box-shadow: 0 2px 4px rgba(16, 185, 129, 0.1); }
  .grade-B{ background:#eff6ff; color:#2563eb; border:1px solid #bfdbfe; box-shadow: 0 2px 4px rgba(59, 130, 246, 0.1); }
  .grade-C{ background:#fef2f2; color:#dc2626; border:1px solid #fecaca; box-shadow: 0 2px 4px rgba(239, 68, 68, 0.1); }
</style>
</head>
<body class="bg-slate-50 font-sans text-slate-800">

<section id="payroll-kpi-score" class="p-6 max-w-screen-2xl mx-auto space-y-6">

  <div class="flex flex-wrap items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold text-slate-800">Xếp loại A/B/C &amp; chấm điểm KPI</h1>
      <p class="text-sm text-slate-500 mt-1">Đánh giá mức hoàn thành theo nhân viên — kỳ <span class="font-semibold text-brand">Tháng 05/2026</span></p>
    </div>
    <div class="flex items-center gap-3">
      <select id="f-ky" class="inp bg-white text-sm"><option>Tháng 05/2026</option><option>Tháng 04/2026</option></select>
      <button class="text-sm border border-slate-200 bg-white hover:bg-slate-50 text-slate-600 font-semibold px-4 py-2.5 rounded-xl flex items-center gap-2 transition-all shadow-sm"><i class="fa-solid fa-file-excel"></i> Xuất Excel</button>
      <button id="btn-save" class="text-sm bg-brand hover:bg-brand-dark text-white font-semibold px-4 py-2.5 rounded-xl flex items-center gap-2 transition-all shadow-sm shadow-brand/30"><i class="fa-solid fa-floppy-disk"></i> Lưu điểm</button>
    </div>
  </div>

  <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 border-l-4 border-l-slate-400">
      <p class="text-sm text-slate-500 font-medium">Đã chấm</p><h3 class="text-2xl font-extrabold text-slate-800 mt-1" id="s-scored">0/0</h3></div>
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 border-l-4 border-l-emerald-400">
      <p class="text-sm text-slate-500 font-medium">Loại A</p><h3 class="text-2xl font-extrabold text-emerald-600 mt-1" id="s-a">0</h3></div>
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 border-l-4 border-l-blue-400">
      <p class="text-sm text-slate-500 font-medium">Loại B</p><h3 class="text-2xl font-extrabold text-blue-600 mt-1" id="s-b">0</h3></div>
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 border-l-4 border-l-red-400">
      <p class="text-sm text-slate-500 font-medium">Loại C</p><h3 class="text-2xl font-extrabold text-red-500 mt-1" id="s-c">0</h3></div>
  </div>

  <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-4 flex flex-wrap items-center gap-3">
    <div class="relative flex-1 min-w-[200px]">
      <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
      <input id="f-search" type="text" placeholder="Tìm nhân viên..." class="w-full pl-9 pr-4 py-2 bg-slate-50 border-none rounded-lg text-sm focus:ring-2 focus:ring-brand outline-none transition-all" />
    </div>
    <select id="f-dept" class="inp bg-slate-50 text-sm"><option value="">Tất cả phòng ban</option></select>
    <select id="f-grade" class="inp bg-slate-50 text-sm">
      <option value="">Tất cả xếp loại</option><option value="A">Loại A</option><option value="B">Loại B</option><option value="C">Loại C</option>
    </select>
  </div>

  <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-sm text-left">
        <thead class="bg-slate-50 text-slate-600 font-semibold border-b border-slate-100">
          <tr>
            <th class="px-4 py-3 sticky left-0 bg-slate-50 z-10">Nhân viên</th>
            <th class="px-3 py-3 text-center">Hoàn thành CV<br><span class="font-normal text-xs text-slate-400">(50%)</span></th>
            <th class="px-3 py-3 text-center">Kỷ luật<br><span class="font-normal text-xs text-slate-400">(20%)</span></th>
            <th class="px-3 py-3 text-center">Sáng kiến<br><span class="font-normal text-xs text-slate-400">(10%)</span></th>
            <th class="px-3 py-3 text-center">Hợp tác<br><span class="font-normal text-xs text-slate-400">(20%)</span></th>
            <th class="px-3 py-3 text-center bg-emerald-50/50">Điểm KPI</th>
            <th class="px-3 py-3 text-center">Xếp loại</th>
            <th class="px-3 py-3 text-right">Thưởng KPI (USD)</th>
            <th class="px-3 py-3 text-center">Trạng thái</th>
          </tr>
        </thead>
        <tbody id="tbl-body" class="divide-y divide-slate-100"></tbody>
      </table>
    </div>
  </div>
</section>

<script src="payroll-vp-config.js"></script>
<script src="payroll-store.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  const WEIGHT=[50,20,10,20];
  const BASE=100; // Updated base KPI bonus in USD
  const COEF={A:1.2,B:1.0,C:0.7};
  const fmt=(n)=>Number(n||0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  // Init Store
  const store = window.MKC_STORE;
  
  // Data structure matches the previous format for rendering but is built from the store
  let DATA = [];
  let currentPeriod = '';

  function loadData() {
    const period = document.getElementById('f-ky').value === 'Tháng 05/2026' ? '2026-05' : '2026-04';
    if (!store.kpi.getAll(period).length) {
      // Initialize if empty for this period using employee list
      const configPeriod = window.MKC_PAYROLL_VP_CONFIG.period?.code || '2026-01';
      const defaultRows = store.kpi.getAll(configPeriod);
      // Clone it to the current period in the store
      const kpiData = store.storage.get(store.kpi.KEY, {});
      kpiData[period] = defaultRows.map(r => ({...r}));
      store.storage.set(store.kpi.KEY, kpiData);
    }
    
    currentPeriod = period;
    const kpiRows = store.kpi.getAll(period);
    
    DATA = kpiRows.map(r => [
      r.empCode,
      r.empName,
      r.department,
      r.scores || [0,0,0,0],
      r.status
    ]);

    // Populate departments filter
    const depts = [...new Set(DATA.map(d=>d[2]))];
    const deptSelect = document.getElementById('f-dept');
    deptSelect.innerHTML = '<option value="">Tất cả phòng ban</option>';
    depts.forEach(d=>{
      if (d) {
        const o=document.createElement('option'); o.value=d; o.textContent=d;
        deptSelect.appendChild(o);
      }
    });
  }

  function calc(scores){
    const total=scores.reduce((a,s,i)=>a+s*WEIGHT[i]/100,0);
    const grade=total>=90?'A':total>=70?'B':'C';
    const bonus=BASE*COEF[grade];
    return {total:Math.round(total*10)/10, grade, bonus};
  }

  function stats(){
    const scored=DATA.filter(d=>d[4]==='done').length;
    document.getElementById('s-scored').textContent=scored+'/'+DATA.length;
    let a=0,b=0,c=0;
    DATA.forEach(d=>{ const g=calc(d[3]).grade; if(g==='A')a++; else if(g==='B')b++; else c++; });
    document.getElementById('s-a').textContent=a;
    document.getElementById('s-b').textContent=b;
    document.getElementById('s-c').textContent=c;
  }

  function render(){
    const q=document.getElementById('f-search').value.trim().toLowerCase();
    const dep=document.getElementById('f-dept').value;
    const gr=document.getElementById('f-grade').value;
    const rows=DATA.filter(d=>{
      const {grade}=calc(d[3]);
      return (!q||d[0].toLowerCase().includes(q)||d[1].toLowerCase().includes(q))&&(!dep||d[2]===dep)&&(!gr||grade===gr);
    });

    document.getElementById('tbl-body').innerHTML=rows.map(d=>{
      const {total,grade,bonus}=calc(d[3]);
      const gc=grade==='A'?'grade-A':grade==='B'?'grade-B':'grade-C';
      const st=d[4]==='done'?'<span class="bg-emerald-100 text-emerald-700 text-[11px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider">Đã chấm</span>':'<span class="bg-amber-100 text-amber-700 text-[11px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider">Chưa chấm</span>';
      const inputs=d[3].map((s,i)=>`<td class="px-3 py-2 text-center"><input type="number" class="score-inp" data-code="${d[0]}" data-idx="${i}" value="${s}" min="0" max="100" /></td>`).join('');
      return `<tr class="hover:bg-slate-50 transition-colors">
        <td class="px-4 py-3 sticky left-0 bg-white z-10 shadow-[2px_0_4px_-2px_rgba(0,0,0,0.05)]"><p class="font-semibold text-slate-800">${d[1]}</p><p class="text-[11px] text-slate-400 font-mono mt-0.5">${d[0]} · ${d[2]}</p></td>
        ${inputs}
        <td class="px-3 py-2 text-center font-bold text-brand bg-emerald-50/30">${total}</td>
        <td class="px-3 py-2 text-center"><span class="inline-flex w-8 h-8 rounded-full items-center justify-center font-extrabold text-sm ${gc}">${grade}</span></td>
        <td class="px-3 py-2 text-right font-bold text-slate-700">${fmt(bonus)}</td>
        <td class="px-3 py-2 text-center">${st}</td></tr>`;
    }).join('');
    stats();
  }

  // Event Delegation
  document.addEventListener('change', (e) => {
    if (e.target.classList.contains('score-inp')) {
      const inp = e.target;
      const row=DATA.find(d=>d[0]===inp.dataset.code);
      if(row){ 
        row[3][+inp.dataset.idx]=Math.min(100,Math.max(0,+inp.value||0)); 
        row[4]='done'; 
        
        // Sync with store
        store.kpi.update(currentPeriod, row[0], row[3], row[4]);

        render(); 
        
        // Return focus to input after render
        const newInp = document.querySelector(`.score-inp[data-code="${inp.dataset.code}"][data-idx="${inp.dataset.idx}"]`);
        if(newInp) {
          newInp.focus();
          // Move cursor to end
          const val = newInp.value;
          newInp.value = '';
          newInp.value = val;
        }
      }
    }
    if (['f-dept', 'f-grade'].includes(e.target.id)) {
      render();
    }
    if (e.target.id === 'f-ky') {
      loadData();
      render();
    }
  });

  document.addEventListener('input', (e) => {
    if (e.target.id === 'f-search') {
      render();
    }
  });

  document.addEventListener('click', (e) => {
    if (e.target.closest('#btn-save')) {
      // In a real app we might post this to the API or trigger the payroll recalc here
      const periodLabel = document.getElementById('f-ky').value;
      alert(`Đã đồng bộ điểm KPI kỳ ${periodLabel} vào hệ thống.`);
    }
  });

  // Initial load
  loadData();
  render();
});
</script>
</body>
</html>
