<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quản lý Phụ cấp & Thưởng - Tiền lương Khối Văn phòng</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<script src="payroll-vp-config.js"></script>
<script>
  tailwind.config = { theme: { extend: { colors: { brand: { light:'#34d399', DEFAULT:'#10b981', dark:'#059669' } } } } };
</script>
<style>
  .inp-cell { border: 1px solid transparent; width: 80px; padding: 4px; text-align: right; border-radius: 4px; outline: none; background: transparent; }
  .inp-cell:hover { border-color: #e2e8f0; background: #fff; }
  .inp-cell:focus { border-color: #10b981; background: #fff; box-shadow: 0 0 0 2px #6ee7b7; }
</style>
</head>
<body class="bg-slate-50 font-sans text-slate-800">

<section id="allowance-matrix" class="p-6 max-w-screen-2xl mx-auto space-y-6">

  <div class="flex flex-wrap items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold text-slate-800">Quản lý Phụ cấp & Thưởng</h1>
      <p class="text-sm text-slate-500 mt-1">Cập nhật và áp dụng các khoản phụ cấp, thưởng ngoài hợp đồng cho nhân viên văn phòng.</p>
    </div>
    <div class="flex items-center gap-3">
      <button class="text-sm border border-slate-200 bg-white hover:bg-slate-50 text-slate-600 font-semibold px-4 py-2 rounded-lg transition-colors flex items-center gap-2">
        <i class="fa-solid fa-file-import"></i> Import Excel
      </button>
      <button id="btn-save" class="text-sm bg-brand hover:bg-brand-dark text-white font-semibold px-5 py-2 rounded-lg flex items-center gap-2 transition-colors">
        <i class="fa-solid fa-floppy-disk"></i> Lưu thay đổi
      </button>
    </div>
  </div>

  <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden flex flex-col">
    <!-- Toolbar / Bulk Action -->
    <div class="px-5 py-4 border-b border-slate-100 flex flex-wrap items-center gap-4 bg-slate-50/50">
      <div class="flex items-center gap-2">
        <select id="f-dept" class="text-sm border border-slate-200 rounded-lg px-3 py-2 bg-white focus:ring-2 focus:ring-brand outline-none">
          <option value="">Tất cả phòng ban</option>
        </select>
        <div class="relative min-w-[200px]">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
          <input id="f-search" type="text" placeholder="Tìm nhân viên..." class="w-full pl-9 pr-4 py-2 bg-white border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-brand outline-none" />
        </div>
      </div>
      <div class="h-8 w-px bg-slate-200 mx-2 hidden md:block"></div>
      <div class="flex items-center gap-2 flex-1">
        <span class="text-sm font-medium text-slate-600">Áp dụng hàng loạt:</span>
        <select id="bulk-type" class="text-sm border border-slate-200 rounded-lg px-3 py-2 bg-white outline-none focus:border-brand focus:ring-1 focus:ring-brand">
          <option value="meal">Phụ cấp ăn trưa</option>
          <option value="house">Phụ cấp nhà ở</option>
          <option value="advance">Tạm ứng</option>
          <option value="holidayBonus">Thưởng lễ, tết</option>
        </select>
        <input id="bulk-amount" type="number" placeholder="Số tiền ($)" class="text-sm border border-slate-200 rounded-lg px-3 py-2 w-28 bg-white outline-none focus:border-brand focus:ring-1 focus:ring-brand">
        <button id="btn-apply-bulk" class="text-sm bg-slate-800 hover:bg-slate-700 text-white font-medium px-4 py-2 rounded-lg transition-colors">Áp dụng</button>
      </div>
    </div>

    <!-- Matrix Table -->
    <div class="overflow-x-auto">
      <table class="w-full text-sm text-left">
        <thead class="bg-slate-50 text-slate-600 font-medium">
          <tr>
            <th class="px-4 py-3 sticky left-0 bg-slate-50 z-10 min-w-[200px]">Nhân viên</th>
            <th class="px-3 py-3 text-right">Ăn trưa ($)</th>
            <th class="px-3 py-3 text-right">Nhà ở ($)</th>
            <th class="px-3 py-3 text-right">Thưởng Lễ ($)</th>
            <th class="px-3 py-3 text-right">Tạm ứng ($)</th>
            <th class="px-3 py-3 text-right">Truy lĩnh ($)</th>
            <th class="px-4 py-3 text-right">Tổng (USD)</th>
          </tr>
        </thead>
        <tbody id="matrix-body" class="divide-y divide-slate-100"></tbody>
      </table>
    </div>
  </div>

</section>

<div id="toast" class="fixed bottom-6 right-6 bg-slate-800 text-white text-sm px-4 py-3 rounded-xl shadow-lg opacity-0 translate-y-2 transition-all pointer-events-none z-50">
  <i class="fa-solid fa-circle-check text-emerald-400"></i><span id="toast-msg"> Đã lưu thành công.</span>
</div>

<script>
(function(){
  const CFG = window.MKC_PAYROLL_VP_CONFIG;
  if (!CFG) return;
  const EMP = CFG.payrollRows;
  
  const $ = (s) => document.querySelector(s);
  const body = $('#matrix-body');
  
  // Trích xuất danh sách phòng ban
  const depts = [...new Set(EMP.map(e => e.department))];
  const fDept = $('#f-dept');
  depts.forEach(d => {
    const o = document.createElement('option'); o.value = d; o.textContent = d;
    fDept.appendChild(o);
  });

  // Khởi tạo state (copy từ config)
  let state = EMP.map(e => ({
    code: e.code,
    name: e.name,
    department: e.department,
    meal: e.meal || 0,
    house: e.house || 0,
    holidayBonus: e.holidayBonus || 0,
    advance: e.advance || 0,
    arrears: e.arrears || 0
  }));

  function calculateTotal(s) {
    return (s.meal + s.house + s.holidayBonus + s.arrears) - s.advance; // Tạm ứng bị trừ
  }

  function render() {
    const q = $('#f-search').value.trim().toLowerCase();
    const dep = fDept.value;
    
    const rows = state.filter(e => (!q || e.code.toLowerCase().includes(q) || e.name.toLowerCase().includes(q)) && (!dep || e.department === dep));
    
    body.innerHTML = rows.map(e => {
      const total = calculateTotal(e);
      return `<tr class="hover:bg-slate-50/60 transition-colors">
        <td class="px-4 py-2 sticky left-0 bg-white z-10 border-r border-slate-100">
          <p class="font-semibold text-slate-800">${e.name}</p>
          <p class="text-xs text-slate-400">${e.code} · ${e.department}</p>
        </td>
        <td class="px-3 py-2 text-right"><input type="number" data-code="${e.code}" data-field="meal" value="${e.meal}" class="inp-cell" /></td>
        <td class="px-3 py-2 text-right"><input type="number" data-code="${e.code}" data-field="house" value="${e.house}" class="inp-cell" /></td>
        <td class="px-3 py-2 text-right"><input type="number" data-code="${e.code}" data-field="holidayBonus" value="${e.holidayBonus}" class="inp-cell" /></td>
        <td class="px-3 py-2 text-right"><input type="number" data-code="${e.code}" data-field="advance" value="${e.advance}" class="inp-cell text-red-600 font-medium" /></td>
        <td class="px-3 py-2 text-right"><input type="number" data-code="${e.code}" data-field="arrears" value="${e.arrears}" class="inp-cell" /></td>
        <td class="px-4 py-2 text-right font-bold ${total < 0 ? 'text-red-600' : 'text-emerald-600'}" id="total-${e.code}">${total.toLocaleString('en-US')}</td>
      </tr>`;
    }).join('') || `<tr><td colspan="7" class="px-4 py-10 text-center text-slate-400">Không tìm thấy dữ liệu.</td></tr>`;

    // Gắn sự kiện thay đổi
    body.querySelectorAll('.inp-cell').forEach(inp => {
      inp.addEventListener('input', (ev) => {
        const val = parseFloat(ev.target.value) || 0;
        const code = ev.target.dataset.code;
        const field = ev.target.dataset.field;
        
        const rowData = state.find(s => s.code === code);
        if (rowData) {
          rowData[field] = val;
          const newTotal = calculateTotal(rowData);
          const totalEl = $(`#total-${code}`);
          totalEl.textContent = newTotal.toLocaleString('en-US');
          totalEl.className = `px-4 py-2 text-right font-bold ${newTotal < 0 ? 'text-red-600' : 'text-emerald-600'}`;
        }
      });
    });
  }

  $('#f-search').addEventListener('input', render);
  fDept.addEventListener('input', render);
  
  // Tính năng áp dụng hàng loạt
  $('#btn-apply-bulk').addEventListener('click', () => {
    const field = $('#bulk-type').value;
    const amount = parseFloat($('#bulk-amount').value);
    if (isNaN(amount)) return;
    
    // Chỉ áp dụng cho các dòng ĐANG HIỂN THỊ trên lưới (phụ thuộc vào filter)
    const q = $('#f-search').value.trim().toLowerCase();
    const dep = fDept.value;
    
    state.forEach(e => {
      if ((!q || e.code.toLowerCase().includes(q) || e.name.toLowerCase().includes(q)) && (!dep || e.department === dep)) {
        e[field] = amount;
      }
    });
    render();
    toast('Đã áp dụng hàng loạt!');
  });

  function toast(m){ 
    $('#toast-msg').textContent=' '+m; 
    const t=$('#toast'); t.style.opacity='1'; t.style.transform='translateY(0)'; 
    setTimeout(() => { t.style.opacity='0'; t.style.transform='translateY(8px)'; }, 2000); 
  }
  
  $('#btn-save').addEventListener('click', () => {
    console.log("Saving state: ", state);
    toast('Đã lưu dữ liệu Phụ cấp & Thưởng vào hệ thống.');
  });

  render();
})();
</script>
</body>
</html>
