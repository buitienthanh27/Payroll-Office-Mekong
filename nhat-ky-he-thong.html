<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nhật ký hệ thống - Tiền lương Khối Văn phòng</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<script>
  tailwind.config = { theme: { extend: { colors: { brand: { light:'#34d399', DEFAULT:'#10b981', dark:'#059669' } } } } };
</script>
<style>
  .inp{ border:1px solid #e2e8f0; border-radius:.5rem; padding:.5rem .75rem; font-size:.875rem; outline:none; }
  .inp:focus{ box-shadow:0 0 0 2px #6ee7b7; border-color:#10b981; }
  .log-create{ border-left:3px solid #10b981; }
  .log-update{ border-left:3px solid #3b82f6; }
  .log-delete{ border-left:3px solid #ef4444; }
  .log-login{ border-left:3px solid #8b5cf6; }
  .log-export{ border-left:3px solid #f59e0b; }
</style>
</head>
<body class="bg-slate-50 font-sans text-slate-800">

<section id="payroll-audit-log" class="p-6 max-w-screen-2xl mx-auto space-y-6">

  <div class="flex flex-wrap items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold text-slate-800">Nhật ký hệ thống</h1>
      <p class="text-sm text-slate-500 mt-1">Theo dõi thao tác người dùng — tạo, sửa, duyệt, xuất dữ liệu.</p>
    </div>
    <button class="text-sm border border-slate-200 bg-white hover:bg-slate-50 text-slate-600 font-semibold px-4 py-2 rounded-lg flex items-center gap-2"><i class="fa-solid fa-file-excel"></i> Xuất log</button>
  </div>

  <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-4 flex flex-wrap items-center gap-3">
    <div class="relative flex-1 min-w-[200px]">
      <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
      <input id="f-search" type="text" placeholder="Tìm người dùng, hành động..." class="w-full pl-9 pr-4 py-2 bg-slate-100 border-none rounded-lg text-sm focus:ring-2 focus:ring-brand outline-none" />
    </div>
    <select id="f-action" class="inp bg-white text-sm">
      <option value="">Tất cả hành động</option>
      <option value="create">Tạo mới</option><option value="update">Cập nhật</option>
      <option value="delete">Xóa</option><option value="login">Đăng nhập</option><option value="export">Xuất dữ liệu</option>
    </select>
    <select id="f-module" class="inp bg-white text-sm">
      <option value="">Tất cả module</option>
      <option value="payroll">Bảng lương</option><option value="approve">Duyệt</option>
      <option value="import">Import</option><option value="config">Cấu hình</option><option value="auth">Xác thực</option>
    </select>
    <input type="date" class="inp bg-white text-sm" value="2026-06-01" />
    <span class="text-slate-400">→</span>
    <input type="date" class="inp bg-white text-sm" value="2026-06-19" />
  </div>

  <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
    <div class="divide-y divide-slate-100 max-h-[600px] overflow-y-auto" id="log-list"></div>
    <div class="px-5 py-3 border-t border-slate-100 flex items-center justify-between text-sm text-slate-500">
      <span id="log-count">0 bản ghi</span>
      <div class="flex items-center gap-2">
        <button class="px-3 py-1 border border-slate-200 rounded-lg hover:bg-slate-50 disabled:opacity-40" disabled><i class="fa-solid fa-chevron-left"></i></button>
        <span>Trang 1 / 3</span>
        <button class="px-3 py-1 border border-slate-200 rounded-lg hover:bg-slate-50"><i class="fa-solid fa-chevron-right"></i></button>
      </div>
    </div>
  </div>
</section>

<script>
(function(){
  const ICONS={ create:['fa-plus','log-create','Tạo mới','bg-emerald-100 text-emerald-700'],
    update:['fa-pen','log-update','Cập nhật','bg-blue-100 text-blue-700'],
    delete:['fa-trash','log-delete','Xóa','bg-red-100 text-red-600'],
    login:['fa-right-to-bracket','log-login','Đăng nhập','bg-purple-100 text-purple-700'],
    export:['fa-file-export','log-export','Xuất','bg-amber-100 text-amber-700'] };

  const DATA=[
    ['19/06/2026 08:12:34','login','auth','Nguyễn Thị Lan','Đăng nhập thành công · IP 192.168.1.45'],
    ['19/06/2026 08:15:02','create','payroll','Nguyễn Thị Lan','Tạo bảng lương Tháng 05/2026 — 8 NV'],
    ['19/06/2026 09:30:18','update','payroll','Trần Văn Đức','Tính lại bảng lương T05/2026'],
    ['18/06/2026 16:45:00','export','payroll','Trần Văn Đức','Xuất Excel bảng lương chi tiết T05'],
    ['18/06/2026 14:20:11','update','approve','Lê Hoàng Cường','Duyệt bước TP TC-KT — bảng lương T05'],
    ['18/06/2026 08:30:55','import','import','Nguyễn Thị Lan','Import chấm công T05 — 248 dòng OK'],
    ['17/06/2026 11:00:00','update','config','Nguyễn Thị Lan','Cập nhật tỷ lệ OT — ngày thường 150%'],
    ['17/06/2026 09:30:22','login','auth','Lê Hoàng Cường','Đăng nhập thành công · IP 10.0.2.15'],
    ['16/06/2026 15:45:33','delete','payroll','Trần Văn Đức','Xóa khấu trừ kỳ luật — VP031 (nhập nhầm)'],
    ['15/06/2026 10:00:00','export','import','Trần Văn Đức','Xuất file chuyển lương VCB — 7 GD'],
  ];

  function render(){
    const q=document.getElementById('f-search').value.trim().toLowerCase();
    const act=document.getElementById('f-action').value;
    const mod=document.getElementById('f-module').value;
    const rows=DATA.filter(d=>
      (!q||d[3].toLowerCase().includes(q)||d[5].toLowerCase().includes(q))&&(!act||d[1]===act)&&(!mod||d[2]===mod));

    document.getElementById('log-list').innerHTML=rows.map(d=>{
      const [icon,cls,lbl,badge]=ICONS[d[1]];
      return `<div class="p-4 hover:bg-slate-50 ${cls} pl-5">
        <div class="flex flex-wrap items-start justify-between gap-2">
          <div class="flex items-start gap-3">
            <div class="w-9 h-9 rounded-lg ${badge.split(' ')[0]} flex items-center justify-center shrink-0"><i class="fa-solid ${icon} ${badge.split(' ')[1]}"></i></div>
            <div><p class="font-semibold text-slate-800">${d[5]}</p>
              <p class="text-xs text-slate-500 mt-1"><span class="font-medium">${d[3]}</span> · <span class="${badge} text-xs font-bold px-1.5 py-0.5 rounded">${lbl}</span> · ${d[2]}</p></div>
          </div>
          <span class="text-xs text-slate-400 font-mono shrink-0">${d[0]}</span>
        </div></div>`;
    }).join('')||'<p class="p-10 text-center text-slate-400">Không có bản ghi.</p>';

    document.getElementById('log-count').textContent=rows.length+' bản ghi';
  }

  document.getElementById('f-search').oninput=render;
  document.getElementById('f-action').onchange=render;
  document.getElementById('f-module').onchange=render;
  render();
})();
</script>
</body>
</html>
