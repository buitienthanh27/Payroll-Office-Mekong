<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Danh mục nền - Tiền lương Khối Văn phòng</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<script>
  tailwind.config = { theme: { extend: { colors: { brand: { light:'#34d399', DEFAULT:'#10b981', dark:'#059669' } } } } };
</script>
<style>
  .inp{ border:1px solid #e2e8f0; border-radius:.5rem; padding:.5rem .75rem; font-size:.875rem; outline:none; }
  .inp:focus{ box-shadow:0 0 0 2px #6ee7b7; border-color:#10b981; }
  .cat-btn.active{ background:#ecfdf5; color:#059669; border-color:#10b981; font-weight:600; }
</style>
</head>
<body class="bg-slate-50 font-sans text-slate-800">

<section id="payroll-master-data" class="p-6 max-w-screen-2xl mx-auto space-y-6">

  <div class="flex flex-wrap items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold text-slate-800">Danh mục nền</h1>
      <p class="text-sm text-slate-500 mt-1">Quản lý dữ liệu tham chiếu — phòng ban, ngân hàng, tỷ lệ BH theo quốc gia.</p>
    </div>
    <button id="btn-add" class="text-sm bg-brand hover:bg-brand-dark text-white font-semibold px-4 py-2 rounded-lg flex items-center gap-2"><i class="fa-solid fa-plus"></i> Thêm mục</button>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-3 space-y-1">
      <button class="cat-btn active w-full text-left px-4 py-2.5 rounded-lg text-sm border border-transparent" data-cat="dept"><i class="fa-solid fa-building w-5"></i> Phòng ban</button>
      <button class="cat-btn w-full text-left px-4 py-2.5 rounded-lg text-sm border border-transparent text-slate-600 hover:bg-slate-50" data-cat="bank"><i class="fa-solid fa-building-columns w-5"></i> Ngân hàng</button>
      <button class="cat-btn w-full text-left px-4 py-2.5 rounded-lg text-sm border border-transparent text-slate-600 hover:bg-slate-50" data-cat="country"><i class="fa-solid fa-globe w-5"></i> Quốc gia / Chi nhánh</button>
      <button class="cat-btn w-full text-left px-4 py-2.5 rounded-lg text-sm border border-transparent text-slate-600 hover:bg-slate-50" data-cat="insurance"><i class="fa-solid fa-shield w-5"></i> Tỷ lệ bảo hiểm</button>
      <button class="cat-btn w-full text-left px-4 py-2.5 rounded-lg text-sm border border-transparent text-slate-600 hover:bg-slate-50" data-cat="allowance"><i class="fa-solid fa-coins w-5"></i> Loại phụ cấp</button>
      <button class="cat-btn w-full text-left px-4 py-2.5 rounded-lg text-sm border border-transparent text-slate-600 hover:bg-slate-50" data-cat="deduct"><i class="fa-solid fa-minus-circle w-5"></i> Loại khấu trừ</button>
      <button class="cat-btn w-full text-left px-4 py-2.5 rounded-lg text-sm border border-transparent text-slate-600 hover:bg-slate-50" data-cat="currency"><i class="fa-solid fa-money-bill-1-wave w-5"></i> Loại tiền tệ</button>
      <button class="cat-btn w-full text-left px-4 py-2.5 rounded-lg text-sm border border-transparent text-slate-600 hover:bg-slate-50" data-cat="rate"><i class="fa-solid fa-arrow-right-arrow-left w-5"></i> Tỉ giá hối đoái</button>
    </div>

    <div class="lg:col-span-3 bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
      <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
        <h2 class="font-bold text-slate-800" id="cat-title">Phòng ban</h2>
        <input id="f-search" type="text" placeholder="Tìm..." class="inp text-sm w-48" />
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm text-left">
          <thead class="bg-slate-50 text-slate-600 font-medium" id="tbl-head"></thead>
          <tbody id="tbl-body" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </div>
  </div>
</section>

<div id="modal" class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50 p-4">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md">
    <div class="px-5 py-4 border-b flex justify-between"><h3 class="font-bold">Thêm danh mục</h3><button id="m-close"><i class="fa-solid fa-xmark text-slate-400"></i></button></div>
    <div class="p-5 space-y-3" id="m-fields"></div>
    <div class="px-5 py-4 border-t flex justify-end gap-3">
      <button id="m-cancel" class="text-sm border px-4 py-2 rounded-lg">Hủy</button>
      <button id="m-save" class="text-sm bg-brand text-white font-semibold px-4 py-2 rounded-lg">Lưu</button>
    </div>
  </div>
</div>

<script>
(function(){
  const CATS={
    dept:{ title:'Phòng ban', cols:['Mã','Tên phòng ban','Quốc gia','Trạng thái'],
      data:[['PB01','Phòng TC-KT','VN','Hoạt động'],['PB02','Phòng TCHC','VN','Hoạt động'],['PB03','Phòng KT-NN','VN','Hoạt động'],['PB04','Phòng KD-XNK','VN','Hoạt động'],['PB05','Phòng QLCL','VN','Hoạt động'],['LA01','Phòng Hành chính','LA','Hoạt động']] },
    bank:{ title:'Ngân hàng', cols:['Mã','Tên ngân hàng','Swift/BIN','Quốc gia'],
      data:[['VCB','Vietcombank','970436','VN'],['TCB','Techcombank','970407','VN'],['BIDV','BIDV','970418','VN'],['ACLE','ACLE Bank','—','LA']] },
    country:{ title:'Quốc gia / Chi nhánh', cols:['Mã','Tên','Loại tiền','Múi giờ'],
      data:[['VN','Việt Nam — CN Bình Dương','VND','UTC+7'],['LA','Lào — Vientiane','LAK','UTC+7'],['KH','Campuchia — Phnom Penh','KHR','UTC+7']] },
    insurance:{ title:'Tỷ lệ bảo hiểm', cols:['Quốc gia','Loại','NLĐ (%)','DN (%)'],
      data:[['VN','BHXH','8','17.5'],['VN','BHYT','1.5','3'],['VN','BHTN','1','1'],['LA','BHXH địa phương','5','8']] },
    allowance:{ title:'Loại phụ cấp', cols:['Mã','Tên','Tính thuế','Tính BH'],
      data:[['PC01','Phụ cấp chức vụ','Có','Có'],['PC02','Phụ cấp đi lại','Không','Không'],['PC03','Phụ cấp ăn trưa','Không','Không']] },
    deduct:{ title:'Loại khấu trừ', cols:['Mã','Tên','Tự động','Mô tả'],
      data:[['KT01','Hoàn ứng','Có','Từ đề nghị tạm ứng'],['KT02','Khoản vay','Không','Trừ góp hàng tháng'],['KT03','Khấu trừ kỷ luật','Không','Quyết định kỷ luật']] },
    currency:{ title:'Loại tiền tệ', cols:['Mã tiền tệ','Tên tiền tệ','Quốc gia','Ký hiệu'],
      data:[['USD','Đô la Mỹ','Mỹ','$'],['KHR','Riel Campuchia','Campuchia','៛'],['VND','Đồng Việt Nam','Việt Nam','đ']] },
    rate:{ title:'Tỉ giá hối đoái', cols:['Cặp tỉ giá','Tỉ giá','Ngày áp dụng','Trạng thái'],
      data:[['USD => VND','24,500','01/01/2026','Hoạt động'],['Riel => USD','0.000248 (4,026 KHR/USD)','01/01/2026','Hoạt động'],['Riel => VND','6.09','01/01/2026','Hoạt động']] },
  };
  let cat='dept';

  function render(){
    const c=CATS[cat];
    document.getElementById('cat-title').textContent=c.title;
    const q=document.getElementById('f-search').value.trim().toLowerCase();
    document.getElementById('tbl-head').innerHTML=`<tr>${c.cols.map(h=>`<th class="px-4 py-3">${h}</th>`).join('')}<th class="px-4 py-3 text-center">Sửa</th></tr>`;
    document.getElementById('tbl-body').innerHTML=c.data.filter(r=>!q||r.some(v=>String(v).toLowerCase().includes(q))).map(r=>`
      <tr class="hover:bg-slate-50">${r.map((v,i)=>`<td class="px-4 py-2.5 ${i===0?'font-mono text-brand':''}">${v}</td>`).join('')}
        <td class="px-4 py-2.5 text-center"><button class="text-brand"><i class="fa-solid fa-pen"></i></button></td></tr>`).join('');
  }

  document.querySelectorAll('.cat-btn').forEach(b=>{
    b.onclick=()=>{
      document.querySelectorAll('.cat-btn').forEach(x=>{ x.classList.remove('active'); x.classList.add('text-slate-600'); });
      b.classList.add('active'); b.classList.remove('text-slate-600');
      cat=b.dataset.cat; document.getElementById('f-search').value=''; render();
    };
  });

  const modal=document.getElementById('modal');
  document.getElementById('btn-add').onclick=()=>{
    document.getElementById('m-fields').innerHTML=CATS[cat].cols.map(c=>
      `<label class="text-sm block">${c}<input type="text" class="inp w-full mt-1" /></label>`).join('');
    modal.classList.remove('hidden'); modal.classList.add('flex');
  };
  const closeM=()=>{ modal.classList.add('hidden'); modal.classList.remove('flex'); };
  document.getElementById('m-close').onclick=closeM; document.getElementById('m-cancel').onclick=closeM;
  document.getElementById('m-save').onclick=()=>{ closeM(); alert('Đã lưu danh mục.'); };
  document.getElementById('f-search').oninput=render;
  render();
})();
</script>
</body>
</html>
